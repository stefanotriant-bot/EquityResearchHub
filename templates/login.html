{% extends "_layout.html" %}
{% block title %}Sign In, Equity Research Hub{% endblock %}
{% block content %}
  <div class="auth-page">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h2 class="auth-title">Sign in to your hub</h2>
      <p class="auth-lede">Pick up where you left off.</p>

      <form method="POST" class="auth-form" action="{{ url_for('login_page') }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required value="{{ email or '' }}" autocomplete="email" autofocus>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary auth-submit">Sign in</button>
      </form>

      <p class="auth-alt">No account yet? <a href="{{ url_for('signup_page') }}">Sign up free</a></p>
    </div>
  </div>
{% endblock %}
